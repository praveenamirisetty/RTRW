
name: Snowflake CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  snowflake-oidc-test:
    name: Test Snowflake OIDC Connection
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # 2. Install and configure Snowflake CLI with OIDC
      - name: Configure Snowflake CLI
        uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true
          cli-version: "3.16"

      # 3. Validate account configuration
      - name: Validate account configuration
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
        run: |
          if [ -z "$SNOWFLAKE_ACCOUNT" ]; then
            echo "SNOWFLAKE_ACCOUNT secret is missing"
            exit 1
          fi
          echo "Snowflake account configuration exists"

      # 4. Inspect OIDC claims (never print the token)
      - name: Debug GitHub OIDC claims
        shell: bash
        run: |
          python - <<'PY'
          import os
          import json
          import base64
          import sys

          token = os.environ.get("SNOWFLAKE_TOKEN")

          if not token:
              print("ERROR: SNOWFLAKE_TOKEN is missing")
              sys.exit(1)

          try:
              payload = token.split(".")[1]
              payload += "=" * (-len(payload) % 4)
              claims = json.loads(
                  base64.urlsafe_b64decode(payload)
              )

              for key in [
                  "iss",
                  "sub",
                  "aud",
                  "repository",
                  "repository_id",
                  "repository_owner",
                  "repository_owner_id",
                  "ref",
                  "event_name"
              ]:
                  print(f"{key}: {claims.get(key)}")

          except Exception as error:
              print(f"Unable to decode token claims: {error}")
              sys.exit(1)
          PY

      # 5. Test Snowflake OIDC connection
      - name: Test Snowflake connection
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
        run: |
          snow connection test -x
